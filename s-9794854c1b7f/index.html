    <script>
      // ===== 外联守卫: 同源白名单 (非本机请求一律空响应) =====
      (function () {
        var realFetch = window.fetch ? window.fetch.bind(window) : null;
        function isLocal(u) {
          try {
            if (!/^https?:/i.test(u)) return true;
            return new URL(u, location.href).host === location.host;
          } catch (e) { return true; }
        }
        if (realFetch) {
          window.fetch = function (input, init) {
            var url = (typeof input === 'string') ? input : (input && input.url) || '';
            if (!isLocal(url)) {
              return Promise.resolve(new Response('{}', {status: 200, headers: {'Content-Type': 'application/json'}}));
            }
            return realFetch(input, init);
          };
          var realOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function (method, url) {
            var args = Array.prototype.slice.call(arguments);
            if (args.length >= 2 && !isLocal(args[1])) args[1] = 'data:text/plain,';
            return realOpen.apply(this, args);
          };
          console.log('[guard] offline allowlist active');
        }
      })();
      // ===== FPS 调速器 + 帧间休眠 (?fps=N / ?idle=1) =====
      (function () {
        var nativeRAF = window.requestAnimationFrame.bind(window);
        window.__shipTargetFPS = 0;
        var last = 0;
        window.__shipSetFPS = function (fps) {
          window.__shipTargetFPS = (fps && fps > 0) ? fps : 0;
          console.log('[fps-shim] target =', window.__shipTargetFPS || 'uncapped');
        };
        window.requestAnimationFrame = function (cb) {
          var idle = /[?&]idle=1/.test(location.search);
          function tick(t) {
            var iv = window.__shipTargetFPS ? (1000 / window.__shipTargetFPS) : 0;
            if (!iv || t - last >= iv - 1) { last = t; cb(t); }
            else if (idle) setTimeout(function () { nativeRAF(tick); }, Math.max(1, iv - (t - last)));
            else nativeRAF(tick);
          }
          return nativeRAF(tick);
        };
        var m = location.search.match(/[?&]fps=(\d+)/);
        if (m) window.__shipSetFPS(parseInt(m[1], 10));
      })();
      var gameInstance;
      var container = document.querySelector("#tuanjie-container");
      var canvas = document.querySelector("#tuanjie-canvas");
      var loadingBar = document.querySelector("#tuanjie-loading-bar");
      var progressBarFull = document.querySelector("#tuanjie-progress-bar-full");
      var fullscreenButton = document.querySelector("#tuanjie-fullscreen-button");
      var warningBanner = document.querySelector("#tuanjie-warning");
      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl.loader.js";
      var config = {
        dataUrl: buildUrl + "/webgl.data",
        frameworkUrl: buildUrl + "/webgl.framework.js",
        codeUrl: buildUrl + "/webgl.wasm",
        symbolsUrl: buildUrl + "/webgl.symbols.json",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "stalk",
        productName: "ShipIO",
        productVersion: "0.1",
        devicePixelRatio: (function () {
          var q = location.search.match(/[?&]dpr=([\d.]+)/);
          if (q) return Math.max(0.5, parseFloat(q[1]));
          // 移动端 DPR=1 省填充率 (?dpr= 可覆盖)
          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) return 1;
          return window.devicePixelRatio || 1;
        })(),
        showBanner: unityShowBanner,
      };

      // By default Tuanjie keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "tuanjie-mobile";
        canvas.className = "tuanjie-mobile";

        // ⛶ 全屏横屏按钮 (Android 真全屏; iOS 弹指引; PWA 内自动隐藏)
        (function () {
          var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          var standalone = window.navigator.standalone === true ||
            window.matchMedia('(display-mode: fullscreen)').matches;
          if (standalone) return;
          var rotBtn = document.createElement('button');
          rotBtn.textContent = isIOS ? '⛶ 全屏（见说明）' : '⛶ 全屏横屏';
          rotBtn.style.cssText = 'position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:99;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(10,20,35,.8);color:#cfe3ff;font-size:14px;';
          rotBtn.onclick = function () {
            if (!isIOS) {
              var el = document.documentElement;
              function go() {
                try { screen.orientation.lock('landscape').catch(function(){}); } catch(e){}
              }
              if (el.requestFullscreen) el.requestFullscreen().then(go, go); else go();
              return;
            }
            var tip = document.createElement('div');
            tip.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:100;max-width:82vw;padding:18px 20px;border-radius:14px;background:rgba(8,18,32,.96);color:#eaf4ff;font-size:15px;line-height:1.8;border:1px solid rgba(255,255,255,.2);';
            tip.innerHTML = '<b>iPhone 真全屏方法</b><br>1. 点 Safari 底部 <b>分享</b> 按钮<br>2. 选择 <b>添加到主屏幕</b><br>3. 从主屏幕图标打开即全屏';
            var close = document.createElement('button');
            close.textContent = '知道了';
            close.style.cssText = 'margin-top:12px;width:100%;padding:10px;border-radius:10px;border:0;background:#2ea3a0;color:#fff;font-size:15px;';
            close.onclick = function () { tip.remove(); };
            tip.appendChild(close);
            document.body.appendChild(tip);
          };
          document.body.appendChild(rotBtn);
        })();

        // 竖屏自动旋转画布 (cover 裁切, 输入经重映射)
        function syncRot() {
          var portrait = window.matchMedia('(orientation: portrait)').matches;
          var mUA = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
          document.body.classList.toggle('rot', portrait && mUA);
        }
        window.addEventListener('resize', syncRot);
        window.addEventListener('orientationchange', function(){ setTimeout(syncRot, 200); });
        syncRot();

        // 旋转模式输入重映射: 拦截 -> 阻断 -> 补发合成事件
        (function () {
          var canvasEl = document.getElementById('tuanjie-canvas');
          if (!canvasEl) return;
          var dispatching = false;
          function gameUV(e) {
            return { u: e.clientY, v: document.documentElement.clientWidth - e.clientX };
          }
          function synthPointer(type, e, u, v) {
            try {
              return new PointerEvent(type, { bubbles: true, cancelable: true, composed: true,
                clientX: u, clientY: v, screenX: u, screenY: v,
                button: e.button || 0, buttons: e.buttons !== undefined ? e.buttons : 1,
                pointerId: e.pointerId || 1, pointerType: e.pointerType || 'touch',
                isPrimary: e.isPrimary !== false, pressure: 0.5, width: 1, height: 1 });
            } catch (err) { return null; }
          }
          function synthTouch(type, e, u, v) {
            try {
              var mk = function (t, cu, cv) {
                return new Touch({ identifier: t ? t.identifier : 1, target: canvasEl,
                  clientX: cu, clientY: cv, pageX: cu, pageY: cv, screenX: cu, screenY: cv });
              };
              var changed = [mk(e.changedTouches ? e.changedTouches[0] : null, u, v)];
              var all = [];
              if (e.touches) for (var i = 0; i < e.touches.length; i++) {
                var t = e.touches[i];
                all.push(mk(t, t.clientY, document.documentElement.clientWidth - t.clientX));
              }
              return new TouchEvent(type, { bubbles: true, cancelable: true, composed: true,
                changedTouches: changed, touches: type === 'touchend' ? [] : all,
                targetTouches: type === 'touchend' ? [] : all });
            } catch (err) { return null; }
          }
          function forward(e) {
            if (dispatching) return;
            if (!document.body.classList.contains('rot')) return;
            if (e.target !== canvasEl) return;
            var uv = gameUV(e);
            var pe = synthPointer(e.type, e, uv.u, uv.v);
            var te = e.type.indexOf('touch') === 0 ? synthTouch(e.type, e, uv.u, uv.v) : null;
            dispatching = true;
            try { if (pe) canvasEl.dispatchEvent(pe); if (te) canvasEl.dispatchEvent(te); }
            finally { dispatching = false; }
            e.stopPropagation();
          }
          ['pointerdown','pointermove','pointerup','pointercancel',
           'touchstart','touchmove','touchend','touchcancel'].forEach(function (ev) {
            window.addEventListener(ev, forward, { capture: true, passive: true });
          });
        })();

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

              canvas.style.width = "max(100vw, calc(100vh * var(--shipA, 1.85)))";
              canvas.style.height = "max(100vh, calc(100vw / var(--shipA, 1.85)))";
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createTuanjieInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((tuanjieInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  tuanjieInstance.SetFullscreen(1);
                };
                gameInstance = tuanjieInstance;
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>

      var textureHandler = {
        downloadFile(textureId, type, prefix) {
          var url = prefix + '.png';
          var cid = type + '_' + textureId;
          var image = new Image();
          image.src = url;
          image.onload = function () {
            downloadedTextures[cid] = {
              data: image,
            };
            if (downloadingTextures[cid] instanceof Array) {
              downloadingTextures[cid].forEach(v => v());
            } else {
              downloadingTextures[cid]();
            }
            delete downloadingTextures[cid];
          };
          image.onerror = function () {
            console.error(url + ' 下载失败！');
          };
        },
      };

      var GameGlobal = {
        TextureConfig: {},
        SpriteAtlasConfig: {},
        DownloadedTextures: downloadedTextures,
        AUDIO_PREFIX: './Assets/Textures/',
      };

    <script>
    // ⏸ 暂停按钮 (桌面+移动通用)
    (function () {
      var paused = false, last = 30;
      var pb = document.createElement('button');
      pb.textContent = '⏸';
      pb.style.cssText = 'position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:99;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(10,20,35,.8);color:#cfe3ff;font-size:14px;';
      pb.onclick = function () {
        paused = !paused;
        if (paused) { last = window.__shipTargetFPS || 30; window.__shipSetFPS(0.04); pb.textContent = '▶'; }
        else { window.__shipSetFPS(last); pb.textContent = '⏸'; }
      };
      // document.body.appendChild(pb); // 线上版暂时隐藏暂停按钮
    })();
    // ⭐ 里程排行榜
    (function () {
      var LB = {
        name: function () { return localStorage.getItem('shipioName') || ''; },
        setName: function (n) { localStorage.setItem('shipioName', n); },
        mileage: function () {
          for (var k in localStorage) if (k.indexOf('_GDVA_') >= 0) {
            try { return JSON.parse(localStorage[k]).mileage || 0; } catch (e) {}
          } return 0;
        },
        runs: function () {
          for (var k in localStorage) if (k.indexOf('_GDVA_') >= 0) {
            try { return JSON.parse(localStorage[k]).baseGameOverCount || 0; } catch (e) {}
          } return 0;
        }
      };
      var lastSent = -1;
      setInterval(function () {
        var m = LB.mileage(), name = LB.name();
        if (!name || m === lastSent) return;
        lastSent = m;
        fetch('/lb', { method: 'POST', body: JSON.stringify({ name: name, mileage: m, runs: LB.runs() }) });
      }, 5000);
      function show() {
        var old = document.getElementById('shipio-lb'); if (old) old.remove();
        fetch('/lb/top').then(function (r) { return r.json(); }).then(function (d) {
          var rows = d.top.map(function (e, i) {
            return '<tr><td>' + (i + 1) + '</td><td style="text-align:left;padding-left:14px">' +
              String(e.name).replace(/[<>&]/g, '') + '</td><td style="text-align:right">' + e.mileage + '</td></tr>';
          }).join('');
          var panel = document.createElement('div');
          panel.id = 'shipio-lb';
          panel.innerHTML = '<div style="position:fixed;inset:0;z-index:250;background:rgba(4,10,20,.9);color:#eaf4ff;display:flex;align-items:center;justify-content:center;">' +
            '<div style="background:#0e1c30;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:20px 26px;min-width:280px">' +
            '<div style="font-size:18px;font-weight:700;margin-bottom:10px">⭐ 里程排行榜</div>' +
            '<table style="width:100%;font-size:14px;border-collapse:collapse"><tr style="color:#8ea6bf"><th>#</th><th>船长</th><th style="text-align:right">里程</th></tr>' +
            (rows || '<tr><td colspan=3 style="padding:10px">暂无记录</td></tr>') + '</table>' +
            '<div style="margin-top:8px;font-size:12px;color:#8ea6bf">我的里程: ' + LB.mileage() + '</div>' +
            '<button style="margin-top:12px;width:100%;padding:8px;border-radius:8px;border:0;background:#2ea3a0;color:#fff;font-size:14px" onclick="this.closest(\'#shipio-lb\').remove()">关闭</button></div></div>';
          document.body.appendChild(panel);
        });
      }
      function askName(cb) {
        var ov = document.createElement('div');
        ov.style.cssText = 'position:fixed;inset:0;z-index:260;background:rgba(4,10,20,.92);color:#eaf4ff;display:flex;align-items:center;justify-content:center;';
        ov.innerHTML = '<div style="background:#0e1c30;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:20px 24px;min-width:280px">' +
          '<div style="font-size:16px;font-weight:700;margin-bottom:12px">输入你的船长名字</div>' +
          '<input id="shipio-name-in" maxlength="12" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:#0a1424;color:#fff;font-size:15px;box-sizing:border-box">' +
          '<button id="shipio-name-ok" style="margin-top:12px;width:100%;padding:10px;border-radius:8px;border:0;background:#2ea3a0;color:#fff;font-size:14px">起航上榜</button></div>';
        document.body.appendChild(ov);
        ov.querySelector('#shipio-name-ok').onclick = function () {
          var v = ov.querySelector('#shipio-name-in').value.trim();
          if (v) { LB.setName(v); ov.remove(); cb(); }
        };
      }
      var lbBtn = document.createElement('button');
      lbBtn.textContent = '⭐';
      lbBtn.style.cssText = 'position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:99;padding:8px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(10,20,35,.8);color:#ffd76a;font-size:14px;';
      lbBtn.onclick = function () { if (LB.name()) show(); else askName(show); };
      // document.body.appendChild(lbBtn); // 线上版暂时隐藏排行榜入口
    })();
    // 竖屏引导层
    (function () {
      var hint = document.createElement('div');
      hint.id = 'rotate-hint';
      hint.innerHTML = '<div style="font-size:64px">📱</div><div class="t1">请横屏游玩</div>' +
        '<div class="t2">糕手大作战是横版海战游戏<br>旋转手机即可自动进入全屏战斗<br><b>iPhone 推荐先"添加到主屏幕"再横屏</b></div>';
      document.body.appendChild(hint);
      function syncRot() {
        var portrait = window.matchMedia('(orientation: portrait)').matches;
        var mUA = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        document.body.classList.toggle('rot', portrait && mUA);
        hint.style.display = (portrait && mUA) ? 'flex' : 'none';
      }
      window.addEventListener('resize', syncRot);
      window.addEventListener('orientationchange', function(){ setTimeout(syncRot, 200); });
      syncRot();
    })();
    // 自诊断 HUD (?debug=1)
    if (/[?&]debug=1/.test(location.search)) {
      (function () {
        var hud = document.createElement('pre');
        hud.style.cssText = 'position:fixed;top:4px;left:4px;z-index:300;margin:0;padding:6px 8px;background:rgba(0,0,0,.75);color:#0f0;font:11px/1.5 Menlo,monospace;border-radius:6px;pointer-events:none;white-space:pre;';
        document.body.appendChild(hud);
        setInterval(function () {
          var c = document.getElementById('tuanjie-canvas');
          var vv = window.visualViewport;
          hud.textContent = 'win ' + window.innerWidth + 'x' + window.innerHeight + '\n' +
            'vis ' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) : 'n/a') + '\n' +
            'dpr ' + window.devicePixelRatio + '\n' +
            'buf ' + (c ? c.width + 'x' + c.height : '-') + '\n' +
            'rot ' + document.body.classList.contains('rot') + ' fps ' + (window.__shipTargetFPS || 'off');
        }, 500);
      })();
    }
    </script>

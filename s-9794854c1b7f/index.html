      var downloadedTextures = {};

      var textureHandler = {
        downloadFile(textureId, type, prefix) {
          var url = prefix + '.png';
          var cid = type + '_' + textureId;
          var image = new Image();
          image.src = url;
          image.onload = function () {
            downloadedTextures[cid] = {
              data: image,
            };
            if (downloadingTextures[cid] instanceof Array) {
              downloadingTextures[cid].forEach(v => v());
            } else {
              downloadingTextures[cid]();
            }
            delete downloadingTextures[cid];
          };
          image.onerror = function () {
            console.error(url + ' 下载失败！');
          };
        },
      };

      var GameGlobal = {
        TextureConfig: {},
        SpriteAtlasConfig: {},
        DownloadedTextures: downloadedTextures,
        AUDIO_PREFIX: './Assets/Textures/',
      };

    // ⏸ 暂停按钮 (桌面+移动通用)
    (function () {
      var paused = false, last = 30;
      var pb = document.createElement('button');
      pb.textContent = '⏸';
      pb.style.cssText = 'position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:99;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(10,20,35,.8);color:#cfe3ff;font-size:14px;';
      pb.onclick = function () {
        paused = !paused;
        if (paused) { last = window.__shipTargetFPS || 30; window.__shipSetFPS(0.04); pb.textContent = '▶'; }
        else { window.__shipSetFPS(last); pb.textContent = '⏸'; }
      };
      // document.body.appendChild(pb); // 线上版暂时隐藏暂停按钮
    })();
    // ⭐ 里程排行榜
    (function () {
      var LB = {
        name: function () { return localStorage.getItem('shipioName') || ''; },
        setName: function (n) { localStorage.setItem('shipioName', n); },
        mileage: function () {
          for (var k in localStorage) if (k.indexOf('_GDVA_') >= 0) {
            try { return JSON.parse(localStorage[k]).mileage || 0; } catch (e) {}
          } return 0;
        },
        runs: function () {
          for (var k in localStorage) if (k.indexOf('_GDVA_') >= 0) {
            try { return JSON.parse(localStorage[k]).baseGameOverCount || 0; } catch (e) {}
          } return 0;
        }
      };
      var lastSent = -1;
      setInterval(function () {
        var m = LB.mileage(), name = LB.name();
        if (!name || m === lastSent) return;
        lastSent = m;
        fetch('/lb', { method: 'POST', body: JSON.stringify({ name: name, mileage: m, runs: LB.runs() }) });
      }, 5000);
      function show() {
        var old = document.getElementById('shipio-lb'); if (old) old.remove();
        fetch('/lb/top').then(function (r) { return r.json(); }).then(function (d) {
          var rows = d.top.map(function (e, i) {
            return '<tr><td>' + (i + 1) + '</td><td style="text-align:left;padding-left:14px">' +
              String(e.name).replace(/[<>&]/g, '') + '</td><td style="text-align:right">' + e.mileage + '</td></tr>';
          }).join('');
          var panel = document.createElement('div');
          panel.id = 'shipio-lb';
          panel.innerHTML = '<div style="position:fixed;inset:0;z-index:250;background:rgba(4,10,20,.9);color:#eaf4ff;display:flex;align-items:center;justify-content:center;">' +
            '<div style="background:#0e1c30;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:20px 26px;min-width:280px">' +
            '<div style="font-size:18px;font-weight:700;margin-bottom:10px">⭐ 里程排行榜</div>' +
            '<table style="width:100%;font-size:14px;border-collapse:collapse"><tr style="color:#8ea6bf"><th>#</th><th>船长</th><th style="text-align:right">里程</th></tr>' +
            (rows || '<tr><td colspan=3 style="padding:10px">暂无记录</td></tr>') + '</table>' +
            '<div style="margin-top:8px;font-size:12px;color:#8ea6bf">我的里程: ' + LB.mileage() + '</div>' +
            '<button style="margin-top:12px;width:100%;padding:8px;border-radius:8px;border:0;background:#2ea3a0;color:#fff;font-size:14px" onclick="this.closest(\'#shipio-lb\').remove()">关闭</button></div></div>';
          document.body.appendChild(panel);
        });
      }
      function askName(cb) {
        var ov = document.createElement('div');
        ov.style.cssText = 'position:fixed;inset:0;z-index:260;background:rgba(4,10,20,.92);color:#eaf4ff;display:flex;align-items:center;justify-content:center;';
        ov.innerHTML = '<div style="background:#0e1c30;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:20px 24px;min-width:280px">' +
          '<div style="font-size:16px;font-weight:700;margin-bottom:12px">输入你的船长名字</div>' +
          '<input id="shipio-name-in" maxlength="12" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:#0a1424;color:#fff;font-size:15px;box-sizing:border-box">' +
          '<button id="shipio-name-ok" style="margin-top:12px;width:100%;padding:10px;border-radius:8px;border:0;background:#2ea3a0;color:#fff;font-size:14px">起航上榜</button></div>';
        document.body.appendChild(ov);
        ov.querySelector('#shipio-name-ok').onclick = function () {
          var v = ov.querySelector('#shipio-name-in').value.trim();
          if (v) { LB.setName(v); ov.remove(); cb(); }
        };
      }
      var lbBtn = document.createElement('button');
      lbBtn.textContent = '⭐';
      lbBtn.style.cssText = 'position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:99;padding:8px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(10,20,35,.8);color:#ffd76a;font-size:14px;';
      lbBtn.onclick = function () { if (LB.name()) show(); else askName(show); };
      // 排行榜按钮: 检测到 /lb 后端时显示 (Pages 静态站无后端, 自动隐藏) (r21 合并旧版工作线)
      fetch('/lb/top').then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
        if (d && d.top) document.body.appendChild(lbBtn);
      }).catch(function () {});
    })();
    // 竖屏一次性轻提示(不阻挡): 画面已自动旋转, 横持体验最佳 (r16)
    (function () {
      if (!window.matchMedia('(orientation: portrait)').matches) return;
      if (!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) return;
      var t = document.createElement('div');
      t.textContent = '竖屏已适配；横持手机或点右下角全屏体验最佳';
      t.style.cssText = 'position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:98;padding:10px 16px;border-radius:12px;background:rgba(8,18,32,.85);color:#cfe3ff;font-size:13px;pointer-events:none;transition:opacity .6s;opacity:.95;';
      document.body.appendChild(t);
      setTimeout(function(){ t.style.opacity = '0'; }, 4000);
      setTimeout(function(){ t.remove(); }, 5200);
    })();
    // 自诊断 HUD (?debug=1)
    if (/[?&]debug=1/.test(location.search)) {
      (function () {
        var hud = document.createElement('pre');
        hud.style.cssText = 'position:fixed;top:4px;left:4px;z-index:300;margin:0;padding:6px 8px;background:rgba(0,0,0,.75);color:#0f0;font:11px/1.5 Menlo,monospace;border-radius:6px;pointer-events:none;white-space:pre;';
        document.body.appendChild(hud);
        setInterval(function () {
          var c = document.getElementById('tuanjie-canvas');
          var vv = window.visualViewport;
          hud.textContent = 'win ' + window.innerWidth + 'x' + window.innerHeight + '\n' +
            'vis ' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) : 'n/a') + '\n' +
            'dpr ' + window.devicePixelRatio + '\n' +
            'buf ' + (c ? c.width + 'x' + c.height : '-') + '\n' +
            'rot ' + document.body.classList.contains('rot') + ' fps ' + (window.__shipTargetFPS || 'off');
        }, 500);
      })();
    }
    </script>
  <script>
(function () {
  if (window.shipGamelog) return; window.shipGamelog = true;
  var sid = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  var q = [];
  function cap(s) { try { s = String(s); } catch (e) { s = '[unprintable]'; } return s.length > 400 ? s.slice(0, 400) : s; }
  function push(kind, args) {
    if (q.length > 800) return;
    try { q.push(kind + '| ' + Array.prototype.map.call(args, cap).join(' ')); } catch (e) {}
  }
  ['log', 'warn', 'error', 'info'].forEach(function (m) {
    var orig = console[m];
    console[m] = function () { push(m, arguments); try { orig.apply(console, arguments); } catch (e) {} };
  });
  window.addEventListener('error', function (e) { push('pageerror', [e.message + ' @' + (e.filename||'') + ':' + e.lineno]); });
  var started = false;
  function start() {
    if (started) return; started = true;
    setInterval(function () {
      if (!q.length) return;
      var batch = q.splice(0, q.length);
      try {
        fetch('/gamelog', { method: 'POST', body: JSON.stringify({ sid: sid, logs: batch }) });
      } catch (e) { q = batch.concat(q); if (q.length > 2000) q.length = 2000; }
    }, 8000);
  }
  fetch('/lb/top').then(function (r) { if (r.ok) start(); }).catch(function () {});
})();
</script>
